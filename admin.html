<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>painel administrativo — mango café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/cardapio.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>

<body class="admin-body">

  <!-- Cabeçalho (mesma estética do cardápio) -->
  <div id="menu-header-placeholder" data-page="admin"></div>
  <script src="js/components/header.js"></script>

  <main class="admin-main">

    <!-- Destaque / ranking dinâmico -->
    <section class="highlight-card" id="highlight-card">
      <p class="loading-state">calculando destaque do dia…</p>
    </section>

    <!-- Filtros -->
    <section class="filter-bar">
      <div class="filter-group" role="group" aria-label="Filtrar por status">
        <span class="filter-label">status:</span>
        <div class="btn-group" role="group">
          <button type="button" class="btn btn-status active" data-status="todos">todos</button>
          <button type="button" class="btn btn-status" data-status="aberto">aberto</button>
          <button type="button" class="btn btn-status" data-status="entregue">entregue</button>
          <button type="button" class="btn btn-status" data-status="pago">pago</button>
        </div>
      </div>

      <div class="filter-group">
        <label for="mesa-filter" class="filter-label">mesa:</label>
        <select id="mesa-filter" class="form-select form-select-sm mesa-select">
          <option value="todas">todas</option>
        </select>
      </div>
    </section>

    <!-- Lista de pedidos -->
    <section class="orders-wrap">
      <div class="table-responsive">
        <table class="table orders-table align-middle">
          <thead>
            <tr>
              <th scope="col">mesa</th>
              <th scope="col">horário</th>
              <th scope="col">itens</th>
              <th scope="col" class="text-end">total</th>
              <th scope="col">status</th>
              <th scope="col" class="text-end">ação</th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <tr>
              <td colspan="6" class="loading-state">carregando pedidos…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>

</html>
